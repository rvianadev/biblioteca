<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sistema de Biblioteca</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Sistema de Biblioteca
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <h1 class="h3 fw-bold">Gerenciamento de livros</h1>
            <p class="text-secondary">
                Cadastre, consulte, atualize e exclua livros.
            </p>
        </div>

        <div id="feedbackMessage" class="alert d-none" role="alert">
        </div>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">
                Cadastro de livros
            </div>

            <div class="card-body">
                <form id="livroForm">

                    <input type="hidden" id="livroId">

                    <div class="mb-3">
                        <label for="titulo" class="form-label">
                            Título
                        </label>
                        <input type="text" class="form-control" id="titulo" maxlength="150" required>
                    </div>

                    <div class="mb-3">
                        <label for="autor" class="form-label">
                            Autor
                        </label>
                        <input type="text" class="form-control" id="autor" maxlength="100" required>
                    </div>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="isbn" class="form-label">
                                ISBN
                            </label>
                            <input type="text" class="form-control" id="isbn">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="anoPublicacao" class="form-label">
                                Ano de publicação
                            </label>
                            <input type="number" class="form-control" id="anoPublicacao">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Salvar livro
                    </button>

                    <button type="button" id="cancelarEdicao" class="btn btn-secondary d-none">
                        Cancelar edição
                    </button>

                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header bg-white fw-bold">
                Livros cadastrados
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>ISBN</th>
                                <th>Ano</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="livrosTabela">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>


    <!-- Modal de confirmação de exclusão -->
    <div class="modal fade" id="confirmarExclusaoModal" tabindex="-1" aria-labelledby="confirmarExclusaoLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="confirmarExclusaoLabel">
                        Confirmar exclusão
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar">
                    </button>
                </div>

                <div class="modal-body">
                    Deseja realmente excluir este livro?
                    <p class="mb-0 mt-2 text-secondary">
                        Esta operação não poderá ser desfeita.
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-danger" id="confirmarExclusaoBtn">
                        Confirmar exclusão
                    </button>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>

</body>

</html>
